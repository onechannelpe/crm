[package]
name = "search-service"
version = "0.1.0"
edition = "2024"

[dependencies]
engine-infra = { path = "../engine-infra" }
axum = "0.8.8"
rusqlite = { version = "0.37.0", features = ["bundled-full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full"] }

[dev-dependencies]
axum-test = "18.7.0"
hex = "0.4.3"
hmac = "0.12.1"
proptest = "1"
sha2 = "0.10.9"
tempfile = "3.25.0"
