[package]
name = "crm-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.8"
dashmap = "6.1.0"
dotenvy = "0.15.7"
hex = "0.4.3"
hmac = "0.12.1"
r2d2 = "0.8.10"
r2d2_sqlite = "0.31.0"
rusqlite = { version = "0.37.0", features = ["bundled-full"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[dev-dependencies]
axum-test = "18.7.0"
tempfile = "3.25.0"
