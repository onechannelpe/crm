[package]
name = "crm-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
engine-infra = { path = "../engine-infra" }
search-service = { path = "../search-service" }
lead-service = { path = "../lead-service" }
axum = "0.8.8"
dotenvy = "0.15.7"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[dev-dependencies]
axum-test = "18.7.0"
rusqlite = { version = "0.37.0", features = ["bundled-full"] }
serde_json = "1.0.149"
tempfile = "3.25.0"
