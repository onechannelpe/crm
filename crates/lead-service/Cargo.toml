[package]
name = "lead-service"
version = "0.1.0"
edition = "2024"

[dependencies]
engine-infra = { path = "../engine-infra" }
axum = "0.8.8"
rusqlite = { version = "0.37.0", features = ["bundled-full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full"] }

[dev-dependencies]
proptest = "1"
r2d2 = "0.8.10"
r2d2_sqlite = "0.31.0"
tempfile = "3.25.0"
