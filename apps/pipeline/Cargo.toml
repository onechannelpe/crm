[package]
name = "crm-pipeline"
version = "0.1.0"
edition = "2024"

[dependencies]
csv = "1.4.0"
hex = "0.4.3"
rusqlite = { version = "0.37.0", features = ["bundled-full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.18"

[dev-dependencies]
tempfile = "3.25.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
