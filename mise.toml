[settings]
experimental = true

[tools]
rust = "1.93.1"
sqlite = "3.51.2"
bun = "1.3.9"

[tasks.clean]
description = "Clean workspace artifacts"
run = "rm -rf apps/web/*.db* apps/*/node_modules node_modules"

[tasks.dev-engine]
description = "Run engine API"
run = "cargo run --manifest-path apps/engine/Cargo.toml"

[tasks.dev-web]
description = "Run web app"
run = "bun --no-env-file --env-file=../../.env run --cwd apps/web dev"

[tasks.dev]
description = "Run engine and web dev servers"
run = [{ tasks = ["dev-engine", "dev-web"] }]

[tasks.build-contacts]
description = "Build canonical contacts.csv from Transfer/data"
run = "python3 scripts/build_contacts.py --data-dir /home/dubu/Transfer/data --output apps/engine/data/contacts.csv --db-path apps/engine/data/contacts_build.sqlite"

[tasks.build-engine-sqlite]
description = "Build engine sqlite snapshot from contacts.csv"
run = "python3 scripts/build_engine_sqlite.py --input apps/engine/data/contacts.csv --output apps/engine/data/contacts.sqlite"

[tasks.test-engine]
description = "Run engine tests"
run = "cargo test --manifest-path apps/engine/Cargo.toml"

[tasks.bench-engine]
description = "Run engine perf regression probe"
run = "cargo test --manifest-path apps/engine/Cargo.toml --test perf_regression perf_regression_probe -- --ignored --nocapture"

[tasks.bench-engine-mem]
description = "Run engine perf probe with memory stats"
run = "/usr/bin/time -v cargo test --manifest-path apps/engine/Cargo.toml --test perf_regression perf_regression_probe -- --ignored --nocapture"

[tasks.generate-engine-contract]
description = "Generate engine API contract bindings"
run = "bun run scripts/generate-engine-contract.ts"

[tasks.check-engine-contract]
description = "Check engine API contract bindings are up to date"
run = "bun run scripts/generate-engine-contract.ts --check"

[tasks.check-web]
description = "Run web checks"
run = "bun --no-env-file --env-file=../../.env run --cwd apps/web check"

[tasks.check-engine]
description = "Run engine type/build checks"
run = "cargo check --manifest-path apps/engine/Cargo.toml"

[tasks.format]
description = "Format all JS/TS files"
run = "bun run format"

[tasks.format-check]
description = "Check JS/TS formatting"
run = "bun run format:check"

[tasks.check]
description = "Run all checks"
depends = ["check-engine-contract", "check-web", "check-engine", "format-check"]

[tasks.download-docs]
description = "Download framework docs for LLM context"
run = "bun run --cwd packages/download-docs download"

[tasks.engine-clippy]
description = "Run Clippy for the engine crate"
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings"
dir = "apps/engine"

[tasks.engine-test]
description = "Run engine crate tests with single thread"
run = "cargo test --tests -- --test-threads=1"
dir = "apps/engine"
