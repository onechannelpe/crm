[workspace]
members = [
    "crates/shared",
    "crates/search",
    "crates/leads",
    "crates/engine",
]
resolver = "3"

[workspace.dependencies]
axum               = { version = "=0.8.8", features = ["macros"] }
tokio              = { version = "=1.50.0", features = ["full"] }
serde              = { version = "=1.0.228", features = ["derive"] }
serde_json         = "=1.0.149"
rusqlite           = { version = "=0.39.0", features = ["bundled"] }
r2d2               = "=0.8.10"
r2d2_sqlite        = "=0.33.0"
hmac               = "=0.12.1"
sha2               = "=0.10.9"
hex                = "=0.4.3"
thiserror          = "=2.0.18"
dashmap            = "=6.1.0"
tracing            = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
dotenvy            = "=0.15.7"
proptest           = "=1.10.0"
tempfile           = "=3.27.0"
axum-test          = "=19.1.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
