[workspace]
members = [
    "crates/shared",
    "crates/search",
    "crates/leads",
    "crates/engine",
    "crates/pipeline",
]
resolver = "3"

[workspace.dependencies]
axum               = { version = "=0.8.9", features = ["macros"] }
tokio              = { version = "=1.52.3", features = ["full"] }
serde              = { version = "=1.0.228", features = ["derive"] }
serde_json         = "=1.0.150"
rusqlite           = { version = "=0.40.1", features = ["bundled"] }
r2d2               = "=0.8.10"
r2d2_sqlite        = "=0.35.0"
hmac               = "=0.13.0"
sha2               = "=0.11.0"
hex                = "=0.4.3"
thiserror          = "=2.0.18"
dashmap            = "=6.2.1"
tracing            = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
dotenvy            = "=0.15.7"
uuid               = { version = "=1.23.5", features = ["v4"] }
proptest           = "=1.11.0"
tempfile           = "=3.27.0"
axum-test          = "=21.0.0"
csv                = "=1.4.0"
encoding_rs        = "=0.8.35"
toml               = "=1.1.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
