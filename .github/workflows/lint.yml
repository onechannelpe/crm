name: web quality

on:
  workflow_dispatch:
  push:
    branches:
      - "master"
    paths:
      - "apps/web/**"
      - "packages/**"
      - "scripts/**"
      - ".oxlintrc.json"
      - ".oxfmtrc.json"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/lint.yml"
  pull_request:
    branches:
      - "master"
    paths:
      - "apps/web/**"
      - "packages/**"
      - "scripts/**"
      - ".oxlintrc.json"
      - ".oxfmtrc.json"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/lint.yml"

jobs:
  lint-and-format:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version: "1.3.9"

      - name: install dependencies
        run: bun install --frozen-lockfile

      - name: generate artifacts
        run: bun run generate

      - name: lint
        working-directory: apps/web
        run: bun run lint

      - name: format check
        run: bun run check:format
