name: repo guard

on:
  workflow_dispatch:
  push:
    branches:
      - "master"
    paths:
      - "contracts/**"
      - "scripts/generate-engine-contract.ts"
      - "apps/engine/**"
      - "package.json"
      - "apps/web/src/server/shared/engine/contract.ts"
      - ".github/workflows/repo-guard.yml"
  pull_request:
    branches:
      - "master"
    paths:
      - "contracts/**"
      - "scripts/generate-engine-contract.ts"
      - "apps/engine/**"
      - "package.json"
      - "apps/web/src/server/shared/engine/contract.ts"
      - ".github/workflows/repo-guard.yml"

jobs:
  contract-and-engine:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: "1.3.9"

      - name: install dependencies
        run: bun install --frozen-lockfile

      - name: check contract sync
        run: bun run check:contract

      - name: check engine
        run: bun run check:engine

  engine-build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: build engine
        run: cargo build --manifest-path apps/engine/Cargo.toml --locked
