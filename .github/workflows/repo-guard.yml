name: repo guard

on:
  workflow_dispatch:
  push:
    branches:
      - "master"
    paths:
      - "contracts/**"
      - "scripts/generate-engine-contract.ts"
      - "apps/engine/**"
      - "package.json"
      - "apps/web/src/server/shared/engine/contract.ts"
      - ".github/workflows/repo-guard.yml"
  pull_request:
    branches:
      - "master"
    paths:
      - "contracts/**"
      - "scripts/generate-engine-contract.ts"
      - "apps/engine/**"
      - "package.json"
      - "apps/web/src/server/shared/engine/contract.ts"
      - ".github/workflows/repo-guard.yml"

jobs:
  contract-and-engine:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.3.9"

      - name: install dependencies
        run: bun install --frozen-lockfile

      - name: check contract sync
        run: bun run check:engine-contract

      - name: check engine
        run: bun run check:engine
