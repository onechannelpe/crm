name: web

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches:
      - "master"
    paths:
      - "apps/web/src/**"
      - "apps/web/tests/**"
      - "apps/web/*.ts"
      - "apps/web/*.json"
      - "apps/web/*.css"
      - "packages/email-composer/**"
      - "packages/message-channels/**"
      - "scripts/*.ts"
      - ".oxlintrc.json"
      - ".oxfmtrc.json"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/web.yml"
  pull_request:
    branches:
      - "master"
    paths:
      - "apps/web/src/**"
      - "apps/web/tests/**"
      - "apps/web/*.ts"
      - "apps/web/*.json"
      - "apps/web/*.css"
      - "packages/email-composer/**"
      - "packages/message-channels/**"
      - "scripts/*.ts"
      - ".oxlintrc.json"
      - ".oxfmtrc.json"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/web.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare generated artifacts
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.12"

      - name: install dependencies
        run: bun install --frozen-lockfile

      - name: generate artifacts
        run: bun run generate

      - name: upload generated artifacts
        uses: actions/upload-artifact@v7
        with:
          name: web-generated-artifacts
          if-no-files-found: error
          path: |
            apps/web/src/server/shared/engine/contract.ts
            apps/web/src/server/shared/engine/projection-contract.ts
            apps/web/src/server/shared/engine/result-contract.ts
            packages/email-composer/src/templates/compiled/**

  format:
    name: Format check
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.12"

      - name: install dependencies
        run: bun install --frozen-lockfile

      - name: check format
        run: bun run check:format:ts

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: prepare

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.12"

      - name: install dependencies
        run: bun install --frozen-lockfile

      - name: download generated artifacts
        uses: actions/download-artifact@v8
        with:
          name: web-generated-artifacts
          path: .

      - name: lint
        run: bun run check:lint

  type-check:
    name: Type check
    runs-on: ubuntu-latest
    needs: prepare

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.12"

      - name: install dependencies
        run: bun install --frozen-lockfile

      - name: download generated artifacts
        uses: actions/download-artifact@v8
        with:
          name: web-generated-artifacts
          path: .

      - name: type check
        working-directory: apps/web
        run: bun run check:types

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: prepare

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.12"

      - name: install dependencies
        run: bun install --frozen-lockfile

      - name: download generated artifacts
        uses: actions/download-artifact@v8
        with:
          name: web-generated-artifacts
          path: .

      - name: build
        working-directory: apps/web
        run: bun run build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: prepare

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.12"

      - name: install dependencies
        run: bun install --frozen-lockfile

      - name: download generated artifacts
        uses: actions/download-artifact@v8
        with:
          name: web-generated-artifacts
          path: .

      - name: test
        working-directory: apps/web
        run: bun run test

  perf-test:
    name: Perf test
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: prepare

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.12"

      - name: install dependencies
        run: bun install --frozen-lockfile

      - name: download generated artifacts
        uses: actions/download-artifact@v8
        with:
          name: web-generated-artifacts
          path: .

      - name: perf test
        working-directory: apps/web
        run: bun run test:perf
