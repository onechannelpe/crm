name: engine quality

on:
  workflow_dispatch:
  push:
    branches:
      - "master"
    paths:
      - "apps/engine/**"
      - "scripts/build-engine-sqlite.py"
      - "package.json"
      - ".github/workflows/engine.yml"
  pull_request:
    branches:
      - "master"
    paths:
      - "apps/engine/**"
      - "scripts/build-engine-sqlite.py"
      - "package.json"
      - ".github/workflows/engine.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SESSION_SECRET: ci-session-secret
  ENGINE_HMAC_SECRET: ci-engine-hmac-secret

jobs:
  engine-tests-and-perf-gate:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: run engine tests
        run: cargo test --manifest-path apps/engine/Cargo.toml

      - name: build perf fixture sqlite
        run: |
          python3 scripts/build-engine-sqlite.py \
            --input apps/engine/tests/fixtures/contacts_perf_ci.csv \
            --output /tmp/engine_perf_ci.sqlite

