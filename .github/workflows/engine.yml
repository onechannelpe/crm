name: engine

on:
  workflow_dispatch:
  push:
    branches:
      - "master"
    paths:
      - "crates/engine/src/**"
      - "crates/engine/tests/**"
      - "crates/engine/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - "scripts/build-engine-sqlite.py"
      - ".github/workflows/engine.yml"
  pull_request:
    branches:
      - "master"
    paths:
      - "crates/engine/src/**"
      - "crates/engine/tests/**"
      - "crates/engine/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - "scripts/build-engine-sqlite.py"
      - ".github/workflows/engine.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: clippy
        run: cargo clippy -p engine --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      SESSION_SECRET: ci-session-secret
      ENGINE_HMAC_SECRET: ci-engine-hmac-secret

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: test
        run: cargo test -p engine

      - name: build perf fixture sqlite
        run: |
          python3 scripts/build-engine-sqlite.py \
            --input crates/engine/tests/fixtures/contacts_perf_ci.csv \
            --output /tmp/engine_perf_ci.sqlite

      # - name: run perf regression gate
