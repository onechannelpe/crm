name: CodSpeed

on:
  push:
    branches:
      - "master"
    paths:
      - "apps/web/**"
      - "packages/**"
      - "bun.lock"
      - ".github/workflows/codspeed.yml"
  pull_request:
    branches:
      - "master"
    paths:
      - "apps/web/**"
      - "packages/**"
      - "bun.lock"
      - ".github/workflows/codspeed.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@4c32875876eebbbb9bc34b8ee07ba2d7bb4b3462 # v2.1.2
        with:
          bun-version: "1.3.9"

      - name: install dependencies
        run: bun install --frozen-lockfile

      - name: run benchmarks
        uses: CodSpeedHQ/action@v4
        with:
          mode: simulation
          run: bun run test:perf
          working-directory: apps/web
