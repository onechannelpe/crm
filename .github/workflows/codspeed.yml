name: CodSpeed

on:
  push:
    branches:
      - "master"
    paths:
      - "apps/web/**"
      - "packages/**"
      - "bun.lock"
      - ".github/workflows/codspeed.yml"
  pull_request:
    branches:
      - "master"
    paths:
      - "apps/web/**"
      - "packages/**"
      - "bun.lock"
      - ".github/workflows/codspeed.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest

    env:
      SESSION_SECRET: ci-session-secret
      ENGINE_HMAC_SECRET: ci-engine-hmac-secret

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@ab8cb4e8f89912a29b87e4abc4554f2301648a5c # v2.1.2
        with:
          bun-version: "1.3.9"

      - name: install dependencies
        run: bun install --frozen-lockfile

      - name: run benchmarks
        uses: CodSpeedHQ/action@v4
        with:
          mode: simulation
          run: bun x vitest bench --run --config vitest.bench.config.ts
          working-directory: apps/web
