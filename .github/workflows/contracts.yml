name: contracts

on:
  workflow_dispatch:
  push:
    branches:
      - "master"
    paths:
      - "contracts/**"
      - "tools/codegen/bin/**"
      - "apps/web/src/server/shared/engine/*contract.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/contracts.yml"
  pull_request:
    branches:
      - "master"
    paths:
      - "contracts/**"
      - "tools/codegen/bin/**"
      - "apps/web/src/server/shared/engine/*contract.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/contracts.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-check:
    name: Contract sync
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version: "1.3.10"

      - name: install dependencies
        run: bun install --frozen-lockfile

      - name: check generated contracts
        run: bun run check:contracts

      - name: check search contract
        run: bun run check:search-contract
