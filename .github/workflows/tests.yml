name: web tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches:
      - "master"
    paths:
      - "apps/web/**"
      - "apps/web/package.json"
      - "bun.lock"
      - ".github/workflows/tests.yml"
  pull_request:
    branches:
      - "master"
    paths:
      - "apps/web/**"
      - "apps/web/package.json"
      - "bun.lock"
      - ".github/workflows/tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.3.9"

      - name: install dependencies
        run: bun install --frozen-lockfile

      - name: generate test env
        run: |
          cp .env.example .env
          sed -i "s/your-session-secret-at-least-32-chars-long/$(openssl rand -hex 32)/" .env
          sed -i "s/your-hmac-secret-must-match-engine/$(openssl rand -hex 32)/" .env

      - name: build web app
        run: bun --filter='@crm/web' run build

  default-tests:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.3.9"

      - name: install dependencies
        run: bun install --frozen-lockfile

      - name: generate test env
        run: |
          cp .env.example .env
          sed -i "s/your-session-secret-at-least-32-chars-long/$(openssl rand -hex 32)/" .env
          sed -i "s/your-hmac-secret-must-match-engine/$(openssl rand -hex 32)/" .env

      - name: run checks
        run: bun run check:web

      - name: run default tests
        working-directory: apps/web
        run: bun run test

  perf-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.3.9"

      - name: install dependencies
        run: bun install --frozen-lockfile

      - name: generate test env
        run: |
          cp .env.example .env
          sed -i "s/your-session-secret-at-least-32-chars-long/$(openssl rand -hex 32)/" .env
          sed -i "s/your-hmac-secret-must-match-engine/$(openssl rand -hex 32)/" .env

      - name: run perf tests
        working-directory: apps/web
        run: bun run test:perf
