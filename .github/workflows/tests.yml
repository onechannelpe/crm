name: web tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches:
      - "master"
    paths:
      - "apps/web/**"
      - "apps/web/package.json"
      - "bun.lock"
      - ".github/workflows/tests.yml"
  pull_request:
    branches:
      - "master"
    paths:
      - "apps/web/**"
      - "apps/web/package.json"
      - "bun.lock"
      - ".github/workflows/tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@ab8cb4e8f89912a29b87e4abc4554f2301648a5c # v2.1.2
        with:
          bun-version: "1.3.9"

      - name: install dependencies
        run: bun install --frozen-lockfile

      - name: generate artifacts
        run: bun run generate

      - name: build web app
        run: bun --filter='@crm/web' run build

  default-tests:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@ab8cb4e8f89912a29b87e4abc4554f2301648a5c # v2.1.2
        with:
          bun-version: "1.3.9"

      - name: install dependencies
        run: bun install --frozen-lockfile

      - name: generate artifacts
        run: bun run generate

      - name: run checks
        run: bun run check:web

      - name: run default tests
        run: bun run --cwd apps/web test

  perf-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@ab8cb4e8f89912a29b87e4abc4554f2301648a5c # v2.1.2
        with:
          bun-version: "1.3.9"

      - name: install dependencies
        run: bun install --frozen-lockfile

      - name: generate artifacts
        run: bun run generate

      - name: run perf tests
        run: bun run --cwd apps/web test:perf
