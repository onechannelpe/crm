name: pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - "master"
    paths:
      - "crates/pipeline/src/**"
      - "crates/pipeline/tests/**"
      - "crates/pipeline/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - ".github/workflows/pipeline.yml"
  pull_request:
    branches:
      - "master"
    paths:
      - "crates/pipeline/src/**"
      - "crates/pipeline/tests/**"
      - "crates/pipeline/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - ".github/workflows/pipeline.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: clippy
        working-directory: crates/pipeline
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: test
        working-directory: crates/pipeline
        run: cargo test
